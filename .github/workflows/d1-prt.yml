name: d1-prt
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prt:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: context
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo "BASE_REF=${{ github.base_ref }}"
          echo "HEAD_REF=${{ github.head_ref }}"
          echo "PR_NUMBER=${{ github.event.pull_request.number }}"
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          echo "HEAD_IS_FORK=${{ github.event.pull_request.head.repo.fork }}"
          echo "MERGE_SHA=${{ github.sha }}"

      - name: prt token scope probes
        env:
          JT: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          p() {
            label="$1"; method="$2"; path="$3"; body="${4:-}"
            if [ -n "$body" ]; then
              code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $JT" -H "Accept: application/vnd.github+json" -d "$body" \
                "https://api.github.com$path")
            else
              code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $JT" -H "Accept: application/vnd.github+json" \
                "https://api.github.com$path")
            fi
            echo "PRT_PROBE $label -> $code :: $(head -c 200 /tmp/p.json | tr -d '\r\n')"
          }
          p rate_limit        GET /rate_limit
          p own_repo          GET /repos/pistotester3/fixture-a
          p installation_repos GET '/installation/repositories?per_page=100'
          p priv_outside      GET /repos/b74-hunt-labs/b74-priv
          p write_comment_inside POST "/repos/pistotester3/fixture-a/issues/${PR}/comments" \
            '{"body":"d1 pull_request_target job-token write test"}'
          p write_contents_put  POST /repos/pistotester3/fixture-a/git/refs \
            '{"ref":"refs/heads/d1-prt-test-ref","sha":"'"$GITHUB_SHA"'"}'

      - name: secret visibility in pull_request_target
        env:
          D1: ${{ secrets.D1_SECRET }}
          D2: ${{ secrets.D1_MISSING }}
        run: |
          echo "SECRET_LEN=${#D1}"
          echo "SECRET_RAW=$D1"
          echo "MISSING_LEN=${#D2}"
          if [ -n "$D1" ]; then echo "SECRET_PRESENT=yes"; else echo "SECRET_PRESENT=no"; fi

      - name: checkout PR head (fork code) explicitly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: who authored the checked-out tree
        run: |
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          echo "--- files ---"
          ls -la
          echo "--- fork marker if present ---"
          cat FORK_MARKER.txt 2>/dev/null || echo "(no FORK_MARKER.txt in fork head)"
          echo "--- attacker-controlled script executed? ---"
          if [ -x ./fork-probe.sh ]; then ./fork-probe.sh; else echo "(no fork-probe.sh)"; fi

      - name: post-token write attempt from PR context
        if: always()
        env:
          JT: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=$(curl -sS -o /tmp/pp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $JT" -H "Accept: application/vnd.github+json" \
            -d '{"body":"d1 PRT post-checkout write test"}' \
            "https://api.github.com/repos/pistotester3/fixture-a/issues/${PR}/comments" || echo 000)
          echo "PRT_POST_CHECKOUT_WRITE=$code"
